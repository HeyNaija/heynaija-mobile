name: Release

# The Android app bundle for Google Play, signed with the upload key
# (docs/release.md). By hand (Actions → Release → Run workflow), or on a v* tag.
# The bundle is this run's artifact, to upload in Play Console. iOS builds are
# archived and uploaded from Xcode (docs/release.md).
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # A release always has push, and is always signed: no secret, no bundle.
      - name: Add google-services.json and the upload key
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          UPLOAD_KEYSTORE: ${{ secrets.UPLOAD_KEYSTORE }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then echo "::error::The GOOGLE_SERVICES_JSON secret is not set"; exit 1; fi
          if [ -z "$UPLOAD_KEYSTORE" ]; then echo "::error::The UPLOAD_KEYSTORE secret is not set (docs/release.md)"; exit 1; fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > androidApp/google-services.json
          printf '%s' "$UPLOAD_KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: Build the app bundle
        env:
          HEYNAIJA_UPLOAD_KEYSTORE: ${{ runner.temp }}/upload.jks
          HEYNAIJA_UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          HEYNAIJA_UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          HEYNAIJA_UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        # Play wants a higher version code for every upload: this workflow's run number.
        run: ./gradlew :androidApp:bundleRelease -PversionCode=${{ github.run_number }}
      - name: Check it is signed
        run: jarsigner -verify androidApp/build/outputs/bundle/release/androidApp-release.aab | grep -q 'jar verified'
      - uses: actions/upload-artifact@v7
        with:
          name: heynaija-android-${{ github.run_number }}
          path: androidApp/build/outputs/bundle/release/androidApp-release.aab
          if-no-files-found: error
