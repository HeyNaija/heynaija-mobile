name: CI

# Runs on pull requests, on pushes to main, and on any branch by hand
# (Actions → CI → Run workflow).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # Firebase's settings, for push (ADR 0023 in the web repository). Pull requests
      # from forks get no secrets; the app then builds without push.
      - name: Add google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf '%s' "$GOOGLE_SERVICES_JSON" > androidApp/google-services.json; fi
      - name: Test the shared code and build the Android app
        run: ./gradlew :shared:testAndroidHostTest :androidApp:assembleDebug

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Test the shared code on the iOS simulator
        run: ./gradlew :shared:iosSimulatorArm64Test
      - name: Build the iOS app
        run: >
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug
          -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
